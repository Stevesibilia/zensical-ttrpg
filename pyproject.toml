[project]
name = "zensical-ttrpg"
version = "0.5.2"
description = "A theme for tabletop RPG campaign sites, on top of Zensical"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stefano Sibilia" }]
requires-python = ">=3.10"
dependencies = ["zensical>=0.0.62"]
keywords = ["zensical", "mkdocs", "theme", "ttrpg", "rpg", "campaign"]
classifiers = [
  "Framework :: MkDocs",
  "Topic :: Games/Entertainment :: Role-Playing",
  "Topic :: Documentation",
]

[project.urls]
Homepage = "https://github.com/Stevesibilia/zensical-ttrpg"

[project.entry-points."mkdocs.themes"]
ttrpg = "zensical_ttrpg"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zensical_ttrpg"]

[tool.hatch.build.targets.sdist]
include = ["zensical_ttrpg", "README.md", "LICENSE"]
