# Builds the example site with the theme, so a template error fails the check.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the theme
        run: pip install .
      - name: Build the example site
        working-directory: example
        run: zensical build
